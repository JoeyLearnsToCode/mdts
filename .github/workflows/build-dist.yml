name: Build dist branch

# The `dist` branch holds the built output so the CLI can be installed from a
# git URL (`npm install -g github:<owner>/<repo>#dist`). Package managers do not
# run build scripts for git-hosted packages, so the build has to happen here.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./packages/frontend
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Build frontend
        run: npm run build:frontend

      - name: Assemble runnable package
        run: npx ts-node --project scripts/tsconfig.json scripts/assemble-dist.ts dist-package

      - name: Publish dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist-package
          git init
          git checkout -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: build dist branch from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin dist:dist
